name: CI

on:
  pull_request:
    branches: [develop, master]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NX_DAEMON: "false"

jobs:
  checks:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # Design tokens: no raw colours / arbitrary sizes outside theme.css (#61).
      - run: npm run lint:tokens
      - run: node --test scripts/check-design-tokens.test.mjs scripts/design-system-export.test.mjs
      # Only projects affected by the PR; build catches failures before Vercel does; build-storybook keeps the ui-components catalogue compiling.
      - run: npx nx affected -t typecheck lint test build build-storybook --base=${{ github.event.pull_request.base.sha }} --head=HEAD

  rules:
    # Security rules tests + endpoint specs (`*.emu.spec.ts`) against the Firestore / Auth emulators
    name: Firestore rules tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npm run rules:check
      - run: npx tsc -p firestore-tests/tsconfig.json --noEmit
      - run: npm run test:rules
      - run: npm run test:emulator

  e2e:
    name: E2E (affected)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - id: affected
        run: node scripts/e2e-affected.mjs ${{ github.event.pull_request.base.sha }}
      - if: steps.affected.outputs.run == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - if: steps.affected.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # No --with-deps: the runner image already has Chrome's system libraries, and apt mirrors can stall for minutes
      - if: steps.affected.outputs.run == 'true'
        run: npx playwright install chromium
      # Emulators (demo-flaner) + `npm run dev` are started by the Playwright config — no secrets.
      - if: steps.affected.outputs.run == 'true'
        run: npx playwright test --config=e2e/playwright.config.ts ${{ steps.affected.outputs.projects }}
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
