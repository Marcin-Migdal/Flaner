name: CI

on:
  pull_request:
    branches: [develop, master]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NX_DAEMON: "false"
  BASE: ${{ github.event.pull_request.base.sha }}

jobs:
  # App builds are not here: deploy-vercel.yml builds every affected app (required check "Deploy result").
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Typecheck, lint
            targets: typecheck lint build-storybook
            cache: lint
          - name: Unit tests
            targets: test
            cache: test
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      # Re-pushes to the same PR reuse unchanged task results; hashes include root config (nx.json namedInputs.sharedGlobals).
      - uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ matrix.cache }}-${{ github.sha }}
          restore-keys: nx-${{ matrix.cache }}-
      # Design tokens: no raw colours / arbitrary sizes outside theme.css (#61).
      - if: matrix.targets != 'test'
        run: npm run lint:tokens
      - if: matrix.targets != 'test'
        run: node --test scripts/check-design-tokens.test.mjs scripts/design-system-export.test.mjs
      # Only projects affected by the PR; build-storybook keeps the ui-components catalogue compiling.
      - run: npx nx affected -t ${{ matrix.targets }} --base=$BASE --head=HEAD

  rules:
    # Security rules tests + endpoint specs (`*.emu.spec.ts`) against the Firestore / Auth emulators
    name: Firestore rules tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - run: npm run rules:check
      - run: npx tsc -p firestore-tests/tsconfig.json --noEmit
      - run: npm run test:rules
      - run: npm run test:emulator

  e2e-plan:
    name: E2E plan
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.affected.outputs.projects }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - id: affected
        run: node scripts/e2e-affected.mjs $BASE

  # One runner per affected Playwright project: emulators + dev servers per runner, report per project.
  e2e:
    name: E2E (${{ matrix.project }})
    needs: e2e-plan
    if: needs.e2e-plan.outputs.projects != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.e2e-plan.outputs.projects) }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # No --with-deps: the runner image already has Chrome's system libraries, and apt mirrors can stall for minutes
      - run: npx playwright install chromium
      # Emulators (demo-flaner) + `npm run dev` are started by the Playwright config — no secrets. `setup` runs as a dependency.
      - run: npx playwright test --config=e2e/playwright.config.ts --project=${{ matrix.project }}
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 14

  # Stable required check: the matrix jobs exist only for affected projects.
  e2e-result:
    name: E2E (affected)
    needs: [e2e-plan, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          PLAN: ${{ needs.e2e-plan.result }}
          E2E: ${{ needs.e2e.result }}
        run: |
          echo "plan=$PLAN e2e=$E2E"
          [ "$PLAN" = success ] && { [ "$E2E" = success ] || [ "$E2E" = skipped ]; }
