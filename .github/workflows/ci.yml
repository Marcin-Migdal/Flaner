name: CI

on:
  pull_request:
    branches: [develop, master]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NX_DAEMON: "false"

jobs:
  checks:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  rules:
    name: Firestore rules tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npm run test:rules

  e2e:
    name: E2E (affected)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - id: affected
        run: node scripts/e2e-affected.mjs ${{ github.event.pull_request.base.sha }}
      - if: steps.affected.outputs.run == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - if: steps.affected.outputs.run == 'true'
        run: npx playwright install --with-deps chromium
      # Emulators (demo-flaner) + `npm run dev` are started by the Playwright config — no secrets.
      - if: steps.affected.outputs.run == 'true'
        run: npx playwright test --config=e2e/playwright.config.ts ${{ steps.affected.outputs.projects }}
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
