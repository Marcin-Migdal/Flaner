<!-- @dsCard height=288 -->
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; background: var(--background); }
      .cover { position: relative; width: 960px; height: 288px; overflow: hidden; background: var(--background); font-family: var(--font-sans); }
      svg { position: absolute; inset: 0; }
      .brand { fill: var(--brand); }
      .brand-dark { fill: var(--brand-dark); }
      .ink { fill: var(--primary); }
      .tint { fill: var(--brand-subtle); }
      .r-3xl { rx: var(--radius-3xl); }
      .r-2xl { rx: var(--radius-2xl); }
      .r-xl { rx: var(--radius-xl); }
      .pill { fill: var(--brand-foreground); opacity: 0.16; rx: 8px; }
      .text { position: absolute; left: 40px; bottom: 32px; max-width: 440px; }
      .name { margin: 0; font-size: 120px; line-height: 0.92; font-weight: 900; letter-spacing: -0.025em; color: var(--foreground); }
      .tagline { margin: 12px 0 0; font-size: 14px; line-height: 20px; color: var(--muted-foreground); }
    </style>
  </head>
  <body>
    <div class="cover">
      <svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
        <!--
          blocks: brand 208×312 (bleeds top + bottom), brand-dark 176×120 (bleeds right), primary 112×112, brand-subtle 64×136
          arrangement: one tall amber slab with satellites, right of x = 480
          pattern: pills (count-badge / ListItem shape) — Flaner is a soft, rounded list UI (cards radius-2xl, pills radius-full)
          scales: gaps space-4 (16px), pill pitch space-14/space-10, radii radius-3xl / radius-2xl / radius-xl / pill 8px (half of 16px)
        -->
        <rect class="tint r-xl" x="480" y="152" width="64" height="136" />
        <rect class="brand r-3xl" x="560" y="-24" width="208" height="336" />
        <rect class="brand-dark r-2xl" x="784" y="40" width="200" height="120" />
        <rect class="ink r-2xl" x="784" y="176" width="112" height="112" />
        <g>
          <rect class="pill" x="584" y="32" width="48" height="16" />
          <rect class="pill" x="640" y="32" width="104" height="16" />
          <rect class="pill" x="584" y="72" width="48" height="16" />
          <rect class="pill" x="640" y="72" width="72" height="16" />
          <rect class="pill" x="584" y="112" width="48" height="16" />
          <rect class="pill" x="640" y="112" width="96" height="16" />
          <rect class="pill" x="584" y="152" width="48" height="16" />
          <rect class="pill" x="640" y="152" width="56" height="16" />
          <rect class="pill" x="584" y="192" width="48" height="16" />
          <rect class="pill" x="640" y="192" width="88" height="16" />
          <rect class="pill" x="584" y="232" width="48" height="16" />
          <rect class="pill" x="640" y="232" width="64" height="16" />
        </g>
      </svg>
      <div class="text">
        <h1 class="name">Flaner</h1>
        <p class="tagline">Plan, shop and connect — with friends and small groups.</p>
      </div>
    </div>
  </body>
</html>
